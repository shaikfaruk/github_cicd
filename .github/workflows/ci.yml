name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - development
      - stagging
      - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "FLASK_ENV=development" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/stagging" ]]; then
            echo "FLASK_ENV=staging" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
            echo "FLASK_ENV=production" >> $GITHUB_ENV
          fi

      - name: Run Flake8 (Code Quality Check)
        run: flake8 --max-line-length=100

      - name: Run Pytest (Unit Tests)
        run: pytest test_case.py

      - name: Start Flask Application
        run: |
          python email_function.py &
          sleep 5


  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application (Placeholder)
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
            echo "Deploying to Production..."
          elif [[ "${{ github.ref }}" == "refs/heads/stagging" ]]; then
            echo "Deploying to Staging..."
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "Deploying to Development..."
          fi
