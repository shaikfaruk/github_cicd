name: Flask CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run Flake8 (Code Quality Check)
        run: flake8 --max-line-length=100

      - name: Run Pytest (Unit Tests)
        run: pytest test_case.py

      - name: Start Flask Application
        run: |
          python email_function.py &
          sleep 5

      - name: Check if Flask is Running
        run: curl --fail http://127.0.0.1:5051/ || (echo "Flask app did not start!" && exit 1)
